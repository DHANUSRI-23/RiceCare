<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiceCare Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    margin:0;
    font-family:'Poppins','Noto Sans Tamil',sans-serif;
    background:#0f172a;
    color:white;
}

/* NAVBAR */
.navbar {
    background:#020617;
    border-bottom:1px solid #1e293b;
}

/* SCAN AREA */
.scan-area {
    height:45vh;
    margin:20px;
    border-radius:20px;
    border:2px dashed #22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

/* SCAN LINE */
.scan-line {
    position:absolute;
    width:100%;
    height:2px;
    background:#22c55e;
    animation:scan 2s infinite;
}

@keyframes scan {
    0% { top:0; }
    100% { top:100%; }
}

/* TEXT */
.scan-text {
    color:#94a3b8;
    text-align:center;
}

/* IMAGE */
#preview {
    max-width:55%;
    max-height:55%;
    object-fit:contain;
    display:none;
    border-radius:12px;
}

/* BUTTON */
.scan-btn {
    width:90%;
    margin:10px auto;
    display:block;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-size:18px;
}

/* RESULT SECTION */
.result-container {
    padding:20px;
}

.result-card {
    background:white;
    color:black;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* TITLE */
.result-title {
    font-size:22px;
    font-weight:600;
    color:#16a34a;
}

/* TAG */
.tag {
    background:#22c55e;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
}

/* SECTION */
.section { margin-top:15px; }

/* PRODUCT */
.product-card {
    display:flex;
    align-items:center;
    gap:15px;
    background:#f0fff4;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
}

.product-card img {
    width:70px;
    border-radius:10px;
}

/* LOADING */
.loading {
    text-align:center;
    padding:30px;
    color:#16a34a;
    font-weight:500;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand text-white">🌾 RiceCare</a>

<button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#navMenu"></button>

<div class="collapse navbar-collapse" id="navMenu">

<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link text-white" href="/" id="navHome"></a></li>
<li class="nav-item"><a class="nav-link text-white" href="/yield" id="navYield"></a></li>
<li class="nav-item"><a class="nav-link active text-success" href="/analyze" id="navAnalyze"></a></li>
</ul>

<select id="langSelect" class="ms-3" onchange="setLanguage(this.value)">
<option value="en">EN</option>
<option value="ta">தமிழ்</option>
</select>

</div>
</div>
</nav>

<!-- SCAN AREA -->
<div class="scan-area" onclick="document.getElementById('file').click()">

<input type="file" id="file" hidden accept="image/*" onchange="previewImage(event)">

<img id="preview">

<div class="scan-line"></div>

<div class="scan-text" id="scanText"></div>

</div>

<button id="scanBtn" class="scan-btn" onclick="analyze()" disabled></button>

<!-- RESULT -->
<div class="result-container">
<div id="result" class="result-card"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🌐 TRANSLATIONS
const translations = {

en:{
navHome:"Home",
navYield:"Yield",
navAnalyze:"Analyze",

scanText:"📸 Tap to scan leaf",
analyzeBtn:"🔍 Analyze",
loading:"🤖 AI analyzing...",

cause:"Cause",
actions:"Actions",
prevention:"Prevention",
product:"Recommended Product",
error:"Error analyzing image",
default:"AI result will appear here"
},

ta:{
navHome:"முகப்பு",
navYield:"விளைச்சல்",
navAnalyze:"பகுப்பாய்வு",

scanText:"📸 இலை ஸ்கேன் செய்யவும்",
analyzeBtn:"🔍 பகுப்பாய்வு",
loading:"🤖 AI ஆய்வு செய்கிறது...",

cause:"காரணம்",
actions:"செய்ய வேண்டியது",
prevention:"தடுப்பு நடவடிக்கை",
product:"பரிந்துரைக்கப்பட்ட பொருள்",
error:"பிழை ஏற்பட்டது",
default:"AI முடிவு இங்கு வரும்"
}

};

// 🌐 LANGUAGE
function setLanguage(lang){
localStorage.setItem("lang",lang);
applyLanguage(lang);
}

function applyLanguage(lang){

const t = translations[lang];

navHome.innerText = t.navHome;
navYield.innerText = t.navYield;
navAnalyze.innerText = t.navAnalyze;

scanText.innerText = t.scanText;
scanBtn.innerText = t.analyzeBtn;

result.innerHTML = `<div style="text-align:center;color:#666">${t.default}</div>`;

document.body.style.fontFamily =
lang==="ta" ? "'Noto Sans Tamil', sans-serif" : "'Poppins', sans-serif";

}

// 📸 PREVIEW
function previewImage(e){
const file=e.target.files[0];
preview.src=URL.createObjectURL(file);
preview.style.display="block";
scanText.style.display="none";
scanBtn.disabled=false;
}

// 🤖 ANALYZE
async function analyze(){

const lang = localStorage.getItem("lang") || "en";
const t = translations[lang];

const file=document.getElementById("file").files[0];

result.innerHTML=`<div class="loading">${t.loading}</div>`;

const formData=new FormData();
formData.append("image",file);
formData.append("lang",lang);

try{

const res=await fetch("/analyze_leaf",{method:"POST",body:formData});
const data=await res.json();

const actions=(data.actions||[]).map(a=>`<li>${a}</li>`).join("");
const prevention=(data.prevention||[]).map(p=>`<li>${p}</li>`).join("");

// ✅ PRODUCT UI
let productHTML = "";
if(data.product){
productHTML = `
<div class="section">
<b>${t.product}</b>
<div class="product-card">
<img src="${data.product.image}">
<div>
<b>${data.product.name}</b><br>
${lang==="ta" ? data.product.price_ta : data.product.price_en}
</div>
</div>
</div>`;
}

result.innerHTML=`
<div class="result-title">
🌿 ${data.prediction} <span class="tag">AI</span>
</div>

${productHTML}

<div class="section">
<b>${t.cause}</b>
<p>${data.cause || "-"}</p>
</div>

<div class="section">
<b>${t.actions}</b>
<ul>${actions}</ul>
</div>

<div class="section">
<b>${t.prevention}</b>
<ul>${prevention}</ul>
</div>
`;

}
catch{
result.innerHTML = t.error;
}

}

// INIT
window.onload=()=>{
let lang = localStorage.getItem("lang") || "en";
langSelect.value = lang;
applyLanguage(lang);
};

</script>

</body>
</html>
