<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiceCare - Yield Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    font-family: 'Poppins','Noto Sans Tamil',sans-serif;
    background:#eef3f7;
}

.dashboard {
    display:flex;
    flex-wrap:wrap;
}

.sidebar {
    width:100%;
    padding:20px;
    background:white;
}

@media(min-width:768px){
.sidebar { width:30%; height:100vh; position:fixed; }
}

.main {
    width:100%;
    padding:20px;
}

@media(min-width:768px){
.main { margin-left:30%; width:70%; }
}

.card-box {
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.yield-value {
    font-size:32px;
    color:#2e7d32;
    font-weight:600;
}

.weather-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.weather-grid div {
    background:#f8fafc;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:14px;
}

.btn-main {
    width:100%;
    border-radius:25px;
}

.navbar {
    background:white;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
<div class="container">

<a class="navbar-brand fw-bold">🌾 RiceCare</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navMenu">

<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="/" id="navHome"></a></li>
<li class="nav-item"><a class="nav-link active" href="/yield" id="navYield"></a></li>
<li class="nav-item"><a class="nav-link" href="/analyze" id="navAnalyze"></a></li>
</ul>

<select id="langSelect" class="ms-3" onchange="setLanguage(this.value)">
<option value="en">EN</option>
<option value="ta">தமிழ்</option>
</select>

</div>
</div>
</nav>

<div class="dashboard">

<div class="sidebar">

<h4 id="formTitle"></h4>

<label id="districtLabel"></label>
<select id="district" class="form-select mb-3"></select>

<label id="seasonLabel"></label>
<select id="season" class="form-select mb-3"></select>

<label id="areaLabel"></label>
<input type="number" id="area" class="form-control mb-3">

<button onclick="predictYield()" class="btn btn-success btn-main" id="predictBtn"></button>

</div>

<div class="main">

<div class="card-box">
<h5 id="yieldTitle"></h5>
<div id="yieldValue" class="yield-value">--</div>
</div>

<div class="card-box">
<h5 id="weatherTitle"></h5>
<div class="weather-grid" id="weatherBox"></div>
</div>

<div class="card-box">
<h5 id="recommendTitle"></h5>
<ul id="recommendBox"></ul>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🌐 TRANSLATIONS
const translations = {

en:{
navHome:"Home",
navYield:"Yield",
navAnalyze:"Analyze",

formTitle:"Crop Input",
district:"District",
season:"Season",
area:"Area (Hectares)",
predict:"Predict Yield",

yieldTitle:"🌾 Yield Prediction",
weatherTitle:"📊 Weather Insights",
recommendTitle:"✔ Recommendations",

loading:"Loading...",
unit:"Tons/Ha",

selectDistrict:"Select District",
selectSeason:"Select Season",

tempAvg:"Temp (Avg)",
tempMax:"Temp (Max)",
tempMin:"Temp (Min)",
humidity:"Humidity",
rainfall:"Rainfall",
solar:"Solar Radiation"
},

ta:{
navHome:"முகப்பு",
navYield:"விளைச்சல்",
navAnalyze:"பகுப்பாய்வு",

formTitle:"பயிர் விவரம்",
district:"மாவட்டம்",
season:"பருவம்",
area:"பரப்பு (ஹெக்டேர்)",
predict:"விளைச்சல் கணிப்பு",

yieldTitle:"🌾 விளைச்சல் கணிப்பு",
weatherTitle:"📊 வானிலை தகவல்",
recommendTitle:"✔ பரிந்துரைகள்",

loading:"ஏற்றுகிறது...",
unit:"டன்/ஹெக்டேர்",

selectDistrict:"மாவட்டம் தேர்வு",
selectSeason:"பருவம் தேர்வு",

tempAvg:"சராசரி வெப்பநிலை",
tempMax:"அதிகபட்ச வெப்பநிலை",
tempMin:"குறைந்தபட்ச வெப்பநிலை",
humidity:"ஈரப்பதம்",
rainfall:"மழை அளவு",
solar:"சூரிய கதிர்வீச்சு"
}

};

// 🌍 DISTRICTS (EN + TA)
const districtData = [
{en:"Ariyalur", ta:"அரியலூர்"},
{en:"Chengalpattu", ta:"செங்கல்பட்டு"},
{en:"Chennai", ta:"சென்னை"},
{en:"Coimbatore", ta:"கோயம்புத்தூர்"},
{en:"Cuddalore", ta:"கடலூர்"},
{en:"Dharmapuri", ta:"தர்மபுரி"},
{en:"Dindigul", ta:"திண்டுக்கல்"},
{en:"Erode", ta:"ஈரோடு"},
{en:"Kallakurichi", ta:"கள்ளக்குறிச்சி"},
{en:"Kanchipuram", ta:"காஞ்சிபுரம்"},
{en:"Kanniyakumari", ta:"கன்னியாகுமரி"},
{en:"Karur", ta:"கரூர்"},
{en:"Krishnagiri", ta:"கிருஷ்ணகிரி"},
{en:"Madurai", ta:"மதுரை"},
{en:"Mayiladuthurai", ta:"மயிலாடுதுறை"},
{en:"Nagapattinam", ta:"நாகப்பட்டினம்"},
{en:"Namakkal", ta:"நாமக்கல்"},
{en:"Nilgiris", ta:"நீலகிரி"},
{en:"Perambalur", ta:"பெரம்பலூர்"},
{en:"Pudukkottai", ta:"புதுக்கோட்டை"},
{en:"Ramanathapuram", ta:"ராமநாதபுரம்"},
{en:"Ranipet", ta:"ராணிப்பேட்டை"},
{en:"Salem", ta:"சேலம்"},
{en:"Sivaganga", ta:"சிவகங்கை"},
{en:"Tenkasi", ta:"தேன்காசி"},
{en:"Thanjavur", ta:"தஞ்சாவூர்"},
{en:"Theni", ta:"தேனி"},
{en:"Thoothukudi", ta:"தூத்துக்குடி"},
{en:"Tiruchirappalli", ta:"திருச்சி"},
{en:"Tirunelveli", ta:"திருநெல்வேலி"},
{en:"Tirupathur", ta:"திருப்பத்தூர்"},
{en:"Tiruppur", ta:"திருப்பூர்"},
{en:"Tiruvallur", ta:"திருவள்ளூர்"},
{en:"Tiruvannamalai", ta:"திருவண்ணாமலை"},
{en:"Tiruvarur", ta:"திருவாரூர்"},
{en:"Vellore", ta:"வேலூர்"},
{en:"Viluppuram", ta:"விழுப்புரம்"},
{en:"Virudhunagar", ta:"விருதுநகர்"}
];

// 🌱 SEASONS
const seasons = {
en:["Kharif","Rabi","Summer","Winter"],
ta:["காரிப்","ரபி","கோடை","குளிர்"]
};

function setLanguage(lang){
localStorage.setItem("lang",lang);
applyLanguage(lang);
}

function applyLanguage(lang){

const t = translations[lang];

navHome.innerText = t.navHome;
navYield.innerText = t.navYield;
navAnalyze.innerText = t.navAnalyze;

formTitle.innerText = t.formTitle;
districtLabel.innerText = t.district;
seasonLabel.innerText = t.season;
areaLabel.innerText = t.area;
predictBtn.innerText = t.predict;

yieldTitle.innerText = t.yieldTitle;
weatherTitle.innerText = t.weatherTitle;
recommendTitle.innerText = t.recommendTitle;

// DISTRICT DROPDOWN
district.innerHTML = `<option value="">${t.selectDistrict}</option>`;
districtData.forEach(d=>{
district.innerHTML += `<option value="${d.en}">${lang==="ta"?d.ta:d.en}</option>`;
});

// SEASON DROPDOWN
season.innerHTML = `<option value="">${t.selectSeason}</option>`;
seasons.en.forEach((s,i)=>{
season.innerHTML += `<option value="${s}">${lang==="ta"?seasons.ta[i]:s}</option>`;
});

}

// 🚀 PREDICT
async function predictYield(){

const lang = localStorage.getItem("lang") || "en";
const t = translations[lang];

yieldValue.innerText = t.loading;

const res = await fetch("/predict_yield",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
district:district.value,
season:season.value,
area:area.value,
lang:lang
})
});

const data = await res.json();

yieldValue.innerText = data.predicted_yield + " " + t.unit;

weatherBox.innerHTML = `
<div>🌡️ <b>${t.tempAvg}</b><br>${data.weather.avg_temperature}°C</div>
<div>🔥 <b>${t.tempMax}</b><br>${data.weather.max_temperature}°C</div>
<div>❄️ <b>${t.tempMin}</b><br>${data.weather.min_temperature}°C</div>
<div>💧 <b>${t.humidity}</b><br>${data.weather.humidity}%</div>
<div>🌧️ <b>${t.rainfall}</b><br>${data.weather.rainfall} mm</div>
<div>🔆 <b>${t.solar}</b><br>${data.weather.solar_radiation}</div>
`;

recommendBox.innerHTML =
(data.recommendations||[]).map(r=>`<li>${r}</li>`).join("");

}

// INIT
window.onload = ()=>{
let lang = localStorage.getItem("lang") || "en";
langSelect.value = lang;
applyLanguage(lang);
};

</script>

</body>
</html>
