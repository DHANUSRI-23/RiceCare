<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RiceCare</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    font-family: 'Poppins','Noto Sans Tamil',sans-serif;
}

/* HERO */
.hero {
    padding:80px 20px;
    background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('/static/images/banner.jpg') center/cover;
    color:white;
    text-align:center;
}

/* FEATURES */
.features {
    padding:60px 20px;
    text-align:center;
}

/* IMAGE SECTION */
.image-section {
    padding:60px 20px;
    text-align:center;
}

/* CIRCLE CARD */
.circle-card {
    margin-bottom:30px;
    transition:0.3s;
}
.circle-card:hover {
    transform:translateY(-10px);
}

/* CIRCLE IMAGE */
.circle-img {
    width:160px;
    height:160px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #e8f5e9;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

/* TEXT */
.circle-title {
    margin-top:15px;
    font-weight:600;
}
.circle-desc {
    font-size:14px;
    color:#555;
}

/* STEPS */
.steps {
    background:#f8f9fa;
    padding:60px 20px;
}

/* FOOTER */
footer {
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>

<div class="col-md-4"><div class="p-3 bg-white rounded"><p id="i3"></p></div></div>

function setLanguage(lang){
localStorage.setItem("lang",lang);
applyLanguage(lang);
}

function applyLanguage(lang){
const t = translations[lang];

for(let key in t){
let el = document.getElementById(key);
if(el) el.innerText = t[key];
}

document.body.style.fontFamily =
lang==="ta" ? "'Noto Sans Tamil', sans-serif" : "'Poppins', sans-serif";
}

window.onload=()=>{
let lang = localStorage.getItem("lang") || "en";
document.getElementById("langSelect").value = lang;
applyLanguage(lang);
};

</script>
